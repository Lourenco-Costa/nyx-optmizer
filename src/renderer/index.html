<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>Nyx Optmizer</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/pages.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail" aria-label="Navegacao Nyx">
        <div class="rail-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M13.7 2.4 5.6 13.5h5.2l-1.2 8.1 8.8-11.6h-5.3z" /></svg>
          </span>
          <span class="brand-word">NYX</span>
          <span class="brand-sub">OPTMIZER</span>
        </div>

        <nav class="rail-nav" id="rail-nav" aria-label="Paginas"></nav>

        <div class="rail-foot">
          <button class="rail-btn" id="rail-license" type="button" data-nav="license" data-tip="Licenca" aria-label="Licenca">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 8.4l3.4 2.6L12 5l4.6 6 3.4-2.6-1.5 9.2H5.5z" /><path d="M6 20h12" /></svg>
          </button>
          <button class="rail-btn" id="rail-settings" type="button" data-nav="settings" data-tip="Definicoes" aria-label="Definicoes">
            <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3.1" /><path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6" /></svg>
          </button>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <div class="tabs" id="tabs" role="tablist" aria-label="Areas do Nyx"></div>
          <div class="topbar-right">
            <span class="preview-pill" id="preview-pill" hidden>PREVIEW</span>
            <span class="status-pill" id="admin-pill" hidden>ADMIN</span>
            <button class="plan-pill" id="pro-pill" type="button" data-nav="license">TRIAL</button>
            <div class="win-controls">
              <button class="win-btn" id="win-min" type="button" aria-label="Minimizar">
                <svg viewBox="0 0 12 12"><path d="M2.4 6h7.2" /></svg>
              </button>
              <button class="win-btn" id="win-max" type="button" aria-label="Maximizar">
                <svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1.2" /></svg>
              </button>
              <button class="win-btn win-close" id="win-close" type="button" aria-label="Fechar">
                <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
              </button>
            </div>
          </div>
        </header>

        <main class="view" id="view" tabindex="-1"></main>

        <footer class="statusbar">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Sistema pronto</span>
          <span class="status-spacer"></span>
          <span class="status-meta" id="status-meta">NYX 1.0.0</span>
        </footer>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal-root" id="modal-root"></div>
    <div id="optimize-root"></div>

    <script src="js/bridge.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/tweaks.js"></script>
    <script src="js/pages/network.js"></script>
    <script src="js/pages/cleaner.js"></script>
    <script src="js/pages/license.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
